[package]
name = "instrument-driver-tektronix"
version = "0.3.0-alpha.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Source-derived Tektronix device profiles; hardware validation pending"
repository = "https://github.com/josh-hemphill/instrument-components-tektronix"
include = ["src/**", "generated/profiles.rs", "/LICENSE-*", "/README.md"]
[dependencies]
instrument-api = "=0.3.0-alpha.1"
instrument-scpi = "=0.3.0-alpha.1"
[features]
default = []
async = ["instrument-api/async", "instrument-scpi/async"]
[dev-dependencies]
instrument-runtime = "=0.3.0-alpha.1"
instrument-testkit = "=0.3.0-alpha.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
