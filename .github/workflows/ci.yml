name: Driver packages and native proof
on:
  push:
    branches: [latest]
  pull_request:
    branches: [latest]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python spec/acceptance/compose.py --check
      - run: python spec/acceptance/reproduce-tds1002.py
  # Keep workflow and SDK source pins on a merged core commit.
  sdk:
    uses: josh-hemphill/instrument-components/.github/workflows/driver-sdk.yml@407f436e22a6ff6500665c9f4dccdbbbaaa88d0a
    with:
      source_repository: josh-hemphill/instrument-components
      source_ref: 407f436e22a6ff6500665c9f4dccdbbbaaa88d0a
  package:
    needs: [acceptance, sdk]
    uses: josh-hemphill/instrument-components/.github/workflows/driver-package-bootstrap.yml@407f436e22a6ff6500665c9f4dccdbbbaaa88d0a
