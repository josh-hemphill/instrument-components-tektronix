name: Driver packages and native proof
on:
  push:
    branches: [latest]
  pull_request:
    branches: [latest]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python spec/acceptance/compose.py --check
      - run: python spec/acceptance/reproduce-tds1002.py
  sdk:
    uses: josh-hemphill/instrument-components/.github/workflows/driver-sdk.yml@1243881c6b91c46ff40cf0cb3cfd4598b8352409
    with:
      source_repository: josh-hemphill/instrument-components
      source_ref: 1243881c6b91c46ff40cf0cb3cfd4598b8352409
  package:
    needs: [acceptance, sdk]
    uses: josh-hemphill/instrument-components/.github/workflows/driver-package-bootstrap.yml@1243881c6b91c46ff40cf0cb3cfd4598b8352409
