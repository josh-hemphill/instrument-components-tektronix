[package]
name="tektronix-package-proof"
version="0.0.0"
edition="2021"
publish=false
[workspace]
[dependencies]
instrument-driver-tektronix="=0.3.0-alpha.1"
instrument-api="=0.3.0-alpha.1"
instrument-runtime="=0.3.0-alpha.1"
instrument-scpi="=0.3.0-alpha.1"
instrument-testkit="=0.3.0-alpha.1"
tokio={version="1",features=["rt","macros","time"],optional=true}
[features]
default=[]
async=["instrument-driver-tektronix/async","instrument-api/async","instrument-runtime/async","instrument-scpi/async","instrument-testkit/async","dep:tokio"]
